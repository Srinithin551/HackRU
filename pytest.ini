[pytest]
# Brain's suite (tests/) and Data's (backend/data/tests/). Data's test_queries_db.py runs against the real
# Tiger Data service when TIGER_DATABASE_URL is set (it deletes every row it writes) and skips otherwise.
# The Presage sensor's tests are JavaScript: cd sensing_client/presage_node && npm test
testpaths = tests backend/data/tests
